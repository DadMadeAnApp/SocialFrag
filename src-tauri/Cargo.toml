[package]
name = "socialfrag"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Game clip editor: gameplay to vertical or landscape highlights with offline auto-captions"
repository = "https://github.com/DadMadeAnApp/SocialFrag"

[lib]
name = "socialfrag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "3"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
