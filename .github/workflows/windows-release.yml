# Builds the Windows installer from source on a GitHub-hosted runner.
# Push a tag like v0.1.0 to publish a Release with the installer attached;
# run it by hand (Actions tab → Run workflow) to get the installer as a build artifact only.
# Third-party actions are pinned to commit SHAs; the build job has read-only repo access and only the
# publish job (which runs no project code) can write the Release.
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Fetch bundled ffmpeg and whisper-cli (checksum-verified)
        shell: pwsh
        env:
          # Read-only token, only so the GitHub API call isn't rate-limited on shared runner IPs.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/fetch-ffmpeg.ps1
          ./scripts/fetch-whisper.ps1

      - name: Test
        shell: bash
        run: |
          npm test
          cd src-tauri && cargo test

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SocialFrag-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SocialFrag-windows-installer
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            Windows 10/11 (x64) installer. Not code-signed yet: if SmartScreen says "Windows protected your PC", click More info → Run anyway.
            Built from this tag's source by GitHub Actions. See the README for features and THIRD_PARTY_NOTICES.md for bundled components.
